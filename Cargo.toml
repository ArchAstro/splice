[workspace]
resolver = "2"
members = ["crates/splice-core", "crates/splice-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ArchAstro/splice"
homepage = "https://github.com/ArchAstro/splice"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
