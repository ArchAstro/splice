name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: builds and packages everything without publishing anything.
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Verify release
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.90"
          components: clippy, rustfmt
      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: splice-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: splice-darwin-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          reported="$("target/${{ matrix.target }}/release/splice" --version)"
          test "${reported}" = "splice ${{ needs.verify.outputs.version }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist stage
          cp LICENSE README.md stage/
          cp -R skill stage/skill
          cp "target/${{ matrix.target }}/release/splice" stage/
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  macos-app:
    name: Build Splice.app
    needs: [verify, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Build a universal Splice.app
        run: |
          set -euo pipefail
          mkdir arm64 x64 build dist
          tar -xzf artifacts/splice-darwin-arm64/splice-darwin-arm64.tar.gz -C arm64
          tar -xzf artifacts/splice-darwin-x64/splice-darwin-x64.tar.gz -C x64
          lipo -create -output splice-universal arm64/splice x64/splice
          scripts/bundle-macos.sh splice-universal build "${{ needs.verify.outputs.version }}"
          lipo -archs build/Splice.app/Contents/MacOS/splice
          test "$(build/Splice.app/Contents/MacOS/splice --version)" = "splice ${{ needs.verify.outputs.version }}"
      # With a Developer ID certificate configured the app is signed and
      # notarized, so it opens without a Gatekeeper warning. Without one it
      # stays ad-hoc signed.
      - name: Sign and notarize
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE}" ]]; then
            echo "No Developer ID certificate is configured; Splice.app stays ad-hoc signed."
            exit 0
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}"
          codesign --force --options runtime --timestamp --sign "${MACOS_SIGNING_IDENTITY}" build/Splice.app
          codesign --verify --strict build/Splice.app
          ditto -c -k --keepParent build/Splice.app "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple build/Splice.app
          security delete-keychain "${keychain}"
          rm -f "${RUNNER_TEMP}/certificate.p12"
      - name: Package
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/Splice.app dist/splice-macos-app.zip
          mkdir dmg
          cp -R build/Splice.app dmg/Splice.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Splice -srcfolder dmg -ov -format UDZO dist/splice-macos.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splice-macos-app
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [verify, build, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create checksums
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) -exec cp '{}' release-assets/ \;
          cd release-assets
          sha256sum ./* | sed 's#  \./#  #' > ../SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: release-assets/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-assets/*
            SHA256SUMS
          generate_release_notes: true
          make_latest: legacy
