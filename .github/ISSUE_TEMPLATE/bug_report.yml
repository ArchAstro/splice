name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: "What you did, step by step: the media (or a small project file), and the clicks, keys or `splice ctl` commands."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Splice version
      placeholder: "splice 0.1.0 (from `splice --version`)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac (Apple silicon or Intel), and `ffmpeg -version` if import, playback or export is involved.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability (those must be reported privately).
          required: true
